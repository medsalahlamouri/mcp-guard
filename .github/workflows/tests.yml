name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyse-statique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Le moteur d'analyse n'utilise que la bibliothèque standard : aucune dépendance à installer.
      - name: Tests du moteur d'analyse
        run: python -m unittest discover -s tests -v
